name: Release Please

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          # In Klarwert, the version is primarily driven by package.json and tauri.conf.json.
          # Release-please can bump these automatically.
          release-type: node
