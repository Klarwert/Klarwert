name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # 24+ für node:sqlite ohne --experimental-sqlite-Flag (In-Memory-Integrationstests,
          # siehe src/test/sqliteTestDb.ts) – Node 20/22 kennen das Built-in-Modul noch nicht
          # bzw. nur hinter dem Flag.
          node-version: 24
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run check-i18n
      - run: npm test
      - run: npm run verify
