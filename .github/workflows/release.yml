name: "Build & Release Klarwert"

on:
  push:
    # Nur ein Tag-Push löst einen vollen Multi-Plattform-Build + Release aus, nicht jeder Push
    # nach main - sonst baut jeder normale Commit ungewollt einen (Draft-)Release (siehe Incident
    # 2026-08-28: ein Push nach main erzeugte einen kaputten Release mit nicht aufgelöstem
    # "v__VERSION__"-Tag). Ablauf für einen Release: Version bumpen (npm run bump-version -- X.Y.Z),
    # committen, Tag vX.Y.Z pushen - siehe CONTRIBUTING.md "Release-Prozess".
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  create-release:
    # Ein einzelner, nicht-parallelisierter Job legt den Release EINMAL an, bevor die drei
    # Plattform-Jobs starten. Ohne das versuchen alle drei gleichzeitig, "einen Draft-Release mit
    # diesem Tag finden, sonst anlegen" auszuführen - ein klassisches Race: findet keiner von ihnen
    # einen bestehenden Release (weil noch keiner existiert), legen zwei von ihnen JEWEILS einen
    # eigenen an. Genau das ist beim v0.1.0-Release am 2026-08-29 passiert: die Windows-Installer
    # landeten auf einem zweiten, nie veröffentlichten Duplikat-Release, während macOS/Linux + SBOM
    # auf dem tatsächlich veröffentlichten landeten.
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.app_version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Read app version
        id: app_version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Create the draft release if it doesn't already exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "v${{ steps.app_version.outputs.version }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release already exists, reusing it."
          else
            gh release create "v${{ steps.app_version.outputs.version }}" \
              --repo "${{ github.repository }}" \
              --title "Klarwert v${{ steps.app_version.outputs.version }}" \
              --notes "Klarwert Multi-Platform Desktop Release (macOS, Windows, Linux)" \
              --draft
          fi

  build-tauri:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: ''
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies (Ubuntu Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signiert Update-Artefakte + erzeugt latest.json automatisch (siehe prompt-auto-update.md).
          # Secrets müssen einmalig manuell angelegt werden (tauri.conf.json#plugins.updater.pubkey
          # bleibt bis dahin leer/"active": false) – siehe SECURITY.md bzw. den Kommentar dort.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'Klarwert v__VERSION__'
          releaseBody: 'Klarwert Multi-Platform Desktop Release (macOS, Windows, Linux)'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Generate SBOM
        if: matrix.platform == 'ubuntu-22.04'
        run: npm run generate-sbom

      - name: Upload SBOM to release
        if: matrix.platform == 'ubuntu-22.04'
        uses: softprops/action-gh-release@v3
        with:
          files: bom.json
          # tauri-action löst "v__VERSION__" (oben) selbst intern zur echten Versionsnummer auf -
          # dieser separate Release-Schritt kennt dieses Platzhalter-Templating aber nicht und würde
          # sonst einen ZWEITEN, eigenen Release mit dem wörtlichen Tag "v__VERSION__" anlegen (genau
          # das ist am 2026-08-28 passiert: ein öffentlicher "Latest"-Release, der nur bom.json enthielt,
          # keine Installer). Deshalb hier explizit dieselbe, echte Versionsnummer verwenden.
          tag_name: v${{ needs.create-release.outputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-release:
    needs: [create-release, build-tauri]
    if: needs.build-tauri.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the draft release
        # Alle drei Plattform-Jobs laden ihre Installer in denselben (von create-release einmalig
        # angelegten) Draft-Release hoch. Erst wenn ALLE erfolgreich fertig sind, wird er
        # veröffentlicht - so sieht kein Nutzer jemals einen halbfertigen Release.
        run: gh release edit "v${{ needs.create-release.outputs.version }}" --draft=false --repo "${{ github.repository }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
